name: tasklane

# What the scaler passes on to its workers, with the rest of WORKER_ENV.
x-worker-env: &worker-env
  DATABASE_URL: postgres://tasklane:tasklane@postgres:5432/tasklane?sslmode=disable
  LOG_FORMAT: json
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-whsec_localdev}
  DATA_DIR: /data
  SMTP_HOST: mailpit
  # One job at a time, so a plan's worker cap is a number of containers and each
  # one the scaler adds is another job running.
  WORKER_CONCURRENCY: "1"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasklane
      POSTGRES_PASSWORD: tasklane
      POSTGRES_DB: tasklane
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasklane -d tasklane"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["api"]
    environment:
      DATABASE_URL: postgres://tasklane:tasklane@postgres:5432/tasklane?sslmode=disable
      LOG_FORMAT: json
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      DEV_API_KEY: ${DEV_API_KEY:-tk_live_localdev}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # The scaler starts and stops the worker containers itself, from its own image
  # and on this network. make down removes them.
  scaler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["scaler"]
    # Docker's socket is only open to root, and whoever can use it is root anyway.
    user: root
    environment:
      <<: *worker-env
      SCALER_DRIVER: docker
      # SCALER_MIN=2 SCALER_MAX=2 make up runs two fixed workers, for comparisons.
      SCALER_MIN: ${SCALER_MIN:-2}
      SCALER_MAX: ${SCALER_MAX:-10}
      WORKER_IMAGE: tasklane-scaler
      WORKER_NETWORK: tasklane_default
      WORKER_VOLUMES: tasklane_jobdata:/data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Only so compose creates the volume the workers share, and down -v removes it.
      - jobdata:/data:ro
    # On the way out it waits for the workers it is still draining.
    stop_grace_period: 50s
    depends_on:
      postgres:
        condition: service_healthy

  # A fake inbox for email.send. Read it at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - "1025:1025"
      - "8025:8025"

  # A webhook target for demos: /post echoes the request back, /status/503 fails.
  httpbin:
    image: mccutchen/go-httpbin:v2.15.0

volumes:
  pgdata:
  jobdata:
